services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_SITE_URL=https://ejbari.me
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backend:
    build: ./backend
    # Published on loopback only: host nginx proxies /api/ and /uploads/ to
    # localhost:5000, but the port stays unreachable from the public network.
    # (Plain `expose` is container-network only, which broke host nginx with 502s.)
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/instance:/app/instance
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz', timeout=2).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

