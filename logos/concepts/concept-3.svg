<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Slash Protocol — //HE</title>
  <desc>Comment syntax slashes + HE, brutalist editorial</desc>
  <rect width="512" height="512" fill="#fafafa"/>
  <g id="icon">
    <!-- // slashes -->
    <g fill="none" stroke="#0a0a0a" stroke-width="26" stroke-linecap="square">
      <path d="M116 360 L198 148"/>
      <path d="M178 360 L260 148"/>
    </g>
    <!-- HE letterforms in mono, geometric -->
    <g font-family="JetBrains Mono, SF Mono, monospace" font-weight="900" fill="#0a0a0a" text-anchor="start">
      <text x="288" y="286" font-size="140" letter-spacing="-8">HE</text>
      <text x="292" y="314" font-size="64" font-weight="900">.</text>
    </g>
    <!-- baseline rule -->
    <rect x="116" y="380" width="280" height="6" fill="#0a0a0a"/>
    <rect x="116" y="396" width="160" height="6" fill="#0a0a0a" opacity="0.35"/>
  </g>
  <g id="wordmark" font-family="JetBrains Mono, SF Mono, monospace" fill="#0a0a0a" text-anchor="middle">
    <text x="256" y="478" font-size="18" letter-spacing="6" font-weight="700">// HEALTH — TECH</text>
  </g>
</svg>
