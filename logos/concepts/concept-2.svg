<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Grid Core — System Node</title>
  <desc>3x3 grid with hollow center, representing stable system with human core</desc>
  <rect width="512" height="512" fill="#fafafa"/>
  <g id="icon" fill="none" stroke="#0a0a0a" stroke-width="14" stroke-linecap="square">
    <!-- outer frame -->
    <rect x="96" y="96" width="320" height="320" stroke-width="22" fill="none"/>
    <!-- inner 3x3 grid -->
    <path d="M202 96 V416 M310 96 V416 M96 202 H416 M96 310 H416"/>
    <!-- center hollow node -->
    <rect x="228" y="228" width="56" height="56" fill="#fafafa" stroke-width="14"/>
    <rect x="244" y="244" width="24" height="24" fill="#0a0a0a" stroke="none"/>
    <!-- corner accents // -->
    <path d="M96 96 L130 96 L96 130 Z" fill="#0a0a0a" stroke="none"/>
    <path d="M416 416 L382 416 L416 382 Z" fill="#0a0a0a" stroke="none"/>
  </g>
  <g id="wordmark" font-family="JetBrains Mono, SF Mono, monospace" font-weight="900" fill="#0a0a0a" text-anchor="middle">
    <text x="256" y="478" font-size="20" letter-spacing="7" font-weight="700">HE — SYSTEM:HUMAN</text>
  </g>
</svg>
